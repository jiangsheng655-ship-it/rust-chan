name: Build DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false # 一个失败不影响另一个继续跑
      matrix:
        target:
          - i686-pc-windows-msvc   # 32位（你的目标）
          - x86_64-pc-windows-msvc # 64位（备用）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # 用RUSTFLAGS环境变量直接传递静态链接参数，避免PowerShell命令问题
      - name: Set static CRT flags
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static -C link-arg:--enable-stdcall-fixup -C link-arg:-NODEFAULTLIB:MSVCRT" >> $GITHUB_ENV

      - name: Build project
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: rust-chan-dll-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.dll
