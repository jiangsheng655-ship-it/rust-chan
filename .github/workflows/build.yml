name: Build zen_stock DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc   # 32位 → 你的通达信主力使用
          - x86_64-pc-windows-msvc # 64位 → 备用

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release DLL (static CRT)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # 只静态链接运行库，不破坏原有代码、依赖、std、文件IO
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Upload 32/64 bit DLL
        uses: actions/upload-artifact@v4
        with:
          name: zen_stock-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zen_stock.dll
