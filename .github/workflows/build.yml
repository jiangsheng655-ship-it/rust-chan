name: Build zen_stock DLL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release DLL & Examples
        run: cargo build --release --target ${{ matrix.target }} --examples
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Organize Files (Smarter Version)
        shell: bash
        run: |
          mkdir -p ./out/
          # 自动寻找 target 目录下所有的 .dll 文件并拷贝到 out 文件夹
          # 这样不管你的项目叫什么名字，都能抓到生成的 DLL
          find target/${{ matrix.target }}/release -maxdepth 2 -name "*.dll" -exec cp {} ./out/ \;
          
          # 列出找到的文件，方便我们在日志里确认
          echo "Found the following DLLs:"
          ls ./out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdx-plugins-${{ matrix.target }}
          path: ./out/*.dll
