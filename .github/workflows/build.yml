name: Build zen_stock DLL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc   # 32位
          - x86_64-pc-windows-msvc # 64位

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release DLL & Examples
        run: cargo build --release --target ${{ matrix.target }} --examples
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Organize Files (Direct Copy)
        # 使用 PowerShell 确保 100% 抓取到所有生成的 DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/
          # 抓取根 release 目录下的主 DLL (zen_stock.dll)
          Copy-Item "target/${{ matrix.target }}/release/*.dll" -Destination ./out/ -ErrorAction SilentlyContinue
          # 抓取 examples 目录下的 DLL (zen_picker.dll)
          Copy-Item "target/${{ matrix.target }}/release/examples/*.dll" -Destination ./out/ -ErrorAction SilentlyContinue
          
          Write-Host "Files found in out directory:"
          Get-ChildItem ./out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdx-plugins-${{ matrix.target }}
          path: out/*.dll
