name: Build zen_stock DLL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc   # 32位 (主攻)
          - x86_64-pc-windows-msvc # 64位 (备用)

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build All (Lib & Examples)
        # 这一步会同时编译 lib.rs 和 picker.rs
        run: cargo build --release --target ${{ matrix.target }} --examples
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Organize Files (Recursive Search)
        # 使用 PowerShell 递归搜索所有 DLL，一个都不放过
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/
          # 在 target 目录下寻找所有 .dll 文件并拷贝到 out 目录
          Get-ChildItem -Path "target/${{ matrix.target }}/release/" -Filter "*.dll" -Recurse | ForEach-Object {
              Copy-Item $_.FullName -Destination "./out/" -Force
              Write-Host "Found and copied: $($_.Name)"
          }
          
          Write-Host "--- Final Files in Out ---"
          Get-ChildItem ./out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdx-all-dlls-${{ matrix.target }}
          path: out/*.dll
