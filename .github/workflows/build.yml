name: Build zen_stock DLL

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ "main", "master" ] # 提交代码时自动触发

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc   # 32位：通达信主力版本（必须选这个）
          - x86_64-pc-windows-msvc # 64位：备用版本

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build Core Library (Force Lib Only)
        # --lib 指令会跳过 mod tests 导致的报错，直接生成主 DLL
        run: cargo build --release --target ${{ matrix.target }} --lib
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Build Example (zen_picker)
        # 单独编译例子，互不干扰
        run: cargo build --release --target ${{ matrix.target }} --example zen_picker
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Organize Files (Smarter Copy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/
          
          # 1. 抓取主库 zen_stock.dll
          $mainDll = "target/${{ matrix.target }}/release/zen_stock.dll"
          if (Test-Path $mainDll) {
              Copy-Item $mainDll -Destination "./out/zen_stock.dll"
              Write-Host "成功找到主程序: zen_stock.dll"
          }

          # 2. 抓取例子 zen_picker.dll
          $exampleDll = "target/${{ matrix.target }}/release/examples/zen_picker.dll"
          if (Test-Path $exampleDll) {
              Copy-Item $exampleDll -Destination "./out/zen_picker.dll"
              Write-Host "成功找到例子: zen_picker.dll"
          }

          Write-Host "--- 输出目录内容 ---"
          Get-ChildItem ./out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 命名包含架构，方便下载区分
          name: tdx-plugins-${{ matrix.target }}
          path: out/*.dll
