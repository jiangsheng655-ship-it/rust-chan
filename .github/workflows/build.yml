name: Build zen_stock DLL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - i686-pc-windows-msvc # 32位 (通达信通用)

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build All
        # 同时编译 lib 和 examples
        run: cargo build --release --target ${{ matrix.target }} --all-targets
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Organize Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/
          
          # 1. 抓取主库 zen_stock.dll
          if (Test-Path "target/${{ matrix.target }}/release/zen_stock.dll") {
              Copy-Item "target/${{ matrix.target }}/release/zen_stock.dll" -Destination "./out/zen_stock.dll"
              Write-Host "Success: zen_stock.dll found."
          } else {
              Write-Error "Error: zen_stock.dll NOT found!"
          }

          # 2. 抓取例子 zen_picker.dll
          if (Test-Path "target/${{ matrix.target }}/release/examples/zen_picker.dll") {
              Copy-Item "target/${{ matrix.target }}/release/examples/zen_picker.dll" -Destination "./out/zen_picker.dll"
              Write-Host "Success: zen_picker.dll found."
          }

          Write-Host "Final files in out folder:"
          Get-ChildItem ./out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdx-plugins-32bit
          path: out/*.dll
